<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>%PRODUCT_NAME%</title>
<style>
  html,body { height:100%; margin:0; background:#111; }
  /* Center the game; the leftover becomes bars on desktop */
  #wrap { position:fixed; inset:0; display:grid; place-items:center; background:#111; }
  #unity-canvas { display:block; background:#000; }
  /* Optional “rotate” overlay for phones in landscape */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
            background:#111; color:#fff; font:600 18px system-ui; }
  @media (orientation:landscape) and (max-width: 900px) { #rotate { display:flex; } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="rotate">Please rotate your device</div>

  <script src="%UNITY_WEBGL_LOADER_URL%"></script>
  <script>
    // --- Portrait design resolution (kept constant for crisp UI) ---
    const DESIGN_W = 1080, DESIGN_H = 1920;
    const canvas = document.getElementById('unity-canvas');

    function sizeCanvas() {
      const ww = window.innerWidth, wh = window.innerHeight;
      const scale = Math.min(ww / DESIGN_W, wh / DESIGN_H);
      canvas.style.width  = Math.round(DESIGN_W * scale) + 'px';
      canvas.style.height = Math.round(DESIGN_H * scale) + 'px';
      // Render resolution stays at design size (sharp UI, predictable layout)
      canvas.width  = DESIGN_W;
      canvas.height = DESIGN_H;
    }
    addEventListener('resize', sizeCanvas, {passive:true});
    addEventListener('orientationchange', sizeCanvas, {passive:true});
    sizeCanvas();

    // Unity boot (keep matchWebGLToCanvasSize false so render res stays DESIGN_W×DESIGN_H)
    createUnityInstance(canvas, {
      dataUrl: "%UNITY_WEBGL_DATA_URL%",
      frameworkUrl: "%UNITY_WEBGL_FRAMEWORK_URL%",
      codeUrl: "%UNITY_WEBGL_CODE_URL%",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "%COMPANY_NAME%",
      productName: "%PRODUCT_NAME%",
      productVersion: "%PRODUCT_VERSION%",
      matchWebGLToCanvasSize: false
    });
  </script>
</body>
</html>
